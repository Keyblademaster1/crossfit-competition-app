# The app used to run on Netlify; it now runs on Vercel (vercel.json), whose
# free plan lets its server sit in Dublin, next to the database. This stays
# only until the Netlify app site is deleted. (The keepalive is a separate
# Netlify site with its own netlify.toml, in keepalive/, and stays.)
#
# Netlify builds from the "release" branch only, never from main: each
# production deploy costs 15 of the free plan's 300 monthly credits, and main
# is pushed many times a day. To put what is on main online:
#
#   git push origin main:release
#
# Settings it needs, in Netlify's environment variables (see the README,
# "Putting it online"): DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL,
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and ADMIN_EMAILS.

[build]
  command = "npm run build"
  publish = ".next"
