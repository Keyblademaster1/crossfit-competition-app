# The keepalive is its own small Netlify site, separate from the app, with
# this folder set as its base directory. The function in netlify/functions
# carries its own schedule, so nothing about it needs listing here.

[build]
  # There is no web page to build, only the function.
  publish = "public"

  # Each production deploy costs 15 of the free plan's 300 monthly credits, so
  # rebuild only when something in this folder changed, not on every push to
  # the repository. The first build (no earlier commit to compare with) always
  # goes ahead. Exit code 0 means "skip", 1 means "build".
  ignore = '[ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ] && exit 1; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- .'
